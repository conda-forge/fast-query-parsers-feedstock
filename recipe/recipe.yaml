# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 1.0.3
  maturin_version: "0.14"
  python_check_max: "3.14"
  # rattler-build doesn't define SP_DIR during test, and chokes on strings starting with %
  unix_sp_dir: $(python -c "print(__import__('site').getsitepackages()[-1])")
  win_sp_dir: Lib\site-packages
  sp_dir: ${{ unix_sp_dir if unix else "%PREFIX%\\" ~ win_sp_dir }}
  abi3_bin: fast_query_parsers.${{ "abi3.so" if unix else "pyd" }}

package:
  name: fast-query-parsers
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fast-query-parsers/fast_query_parsers-${{ version }}.tar.gz
  sha256: 5200a9e02997ad51d4d76a60ea1b256a68a184b04359540eb6310a15013df68f

build:
  number: 4
  python:
    version_independent: true
  # only build for the minimal python version
  skip: is_abi3 and not is_python_min
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO: cargo-auditable-wrapper${{ ".bat" if win }}
    file: build-fast-query-parsers

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
  host:
    - maturin ${{ maturin_version }}.*
    - pip
    - python
    - if: is_abi3
      then:
        - python-abi3
  run:
    - python

tests:
  - python:
      imports: fast_query_parsers
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - tests/
    requirements:
      run:
        - mypy
        - pytest-cov
        - if: is_abi3
          then:
            - abi3audit
    script:
      - coverage run --source=fast_query_parsers --branch -m pytest -vv --tb=long --color=yes
      - coverage report --show-missing --skip-covered --fail-under=83
      - mypy -p fast_query_parsers
      - if: is_abi3
        then:
          - cd "${{ sp_dir }}" && cd fast_query_parsers
          - abi3audit -s -v --assume-minimum-abi3 ${{ python_min }} ${{ abi3_bin }}

about:
  summary: Ultra-fast query string and url-encoded form-data parsers
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://pypi.org/project/fast-query-parsers
  repository: https://github.com/litestar-org/fast-query-parsers

extra:
  recipe-maintainers:
    - bollwyvl
